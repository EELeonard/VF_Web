app = "vf-web"
primary_region = "vie"

[build]
  dockerfile = "Dockerfile"

[env]
  DATABASE_PATH = "/data/viennaflight.sqlite"
  NODE_ENV = "production"
  PORT = "3000"

[[mounts]]
  source = "vf_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/preview-login"
    timeout = "5s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
